language: 'rust'

taskOptions:
  cache: false

tasks:
  build:
    command: 'cargo build --workspace --locked'
  format:
    command: 'cargo fmt --all --check'
  typecheck:
    command: 'cargo check --workspace --all-targets --locked'
  lint:
    command: 'cargo clippy --workspace --all-targets --locked'
    env:
      CARGO_BUILD_WARNINGS: 'deny'
  test:
    command: 'cargo test --workspace --locked'

  check-proofs:
    toolchains: 'system'
    script: >-
      elan run --install "$(cat crates/stun/proofs/lean-toolchain)"
      lake -d crates/stun/proofs build
    inputs:
      - 'crates/stun/proofs/**/*.lean'
      - 'crates/stun/proofs/lean-toolchain'
      - 'crates/stun/proofs/lakefile.toml'
      - 'crates/stun/proofs/lake-manifest.json'

  setup-tlc:
    toolchains: 'system'
    script: |
      set -eu
      mkdir -p .cache
      download=$(mktemp .cache/tla2tools.XXXXXXXX)
      trap 'rm -f -- "$download"' EXIT
      curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$download"
      checksum=$(openssl dgst -sha256 -r "$download")
      if [ "${checksum%% *}" != "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88" ]; then
        echo "tla2tools.jar: SHA-256 mismatch" >&2
        exit 1
      fi
      mv "$download" .cache/tla2tools.jar

  check-models:
    toolchains: 'system'
    script: |
      set -eu
      cd packages/browser-sdk/specs
      tmp=$(mktemp -d)
      trap 'rm -rf -- "$tmp"' EXIT
      java -Djava.io.tmpdir="$tmp" -jar ../../../.cache/tla2tools.jar -metadir "$tmp" ConnectionNotifications.tla
    inputs:
      - 'packages/browser-sdk/specs/**/*.tla'
      - 'packages/browser-sdk/specs/**/*.cfg'
