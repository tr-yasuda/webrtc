language: 'rust'

taskOptions:
  cache: false

tasks:
  build:
    command: 'cargo build --workspace --locked'
  format:
    command: 'cargo fmt --all --check'
  typecheck:
    command: 'cargo check --workspace --all-targets --locked'
  lint:
    command: 'cargo clippy --workspace --all-targets --locked'
    env:
      CARGO_BUILD_WARNINGS: 'deny'
  test:
    command: 'cargo test --workspace --locked'

  check-proofs:
    toolchains: 'system'
    script: |
      elan run --install "$(cat crates/stun/proofs/lean-toolchain)" lake -d crates/stun/proofs build
      elan run --install "$(cat packages/authorization/proofs/lean-toolchain)" lake -d packages/authorization/proofs build
      scripts/check-authorization-axioms.sh
    inputs:
      - 'crates/stun/proofs/**/*.lean'
      - 'crates/stun/proofs/lean-toolchain'
      - 'crates/stun/proofs/lakefile.toml'
      - 'crates/stun/proofs/lake-manifest.json'
      - 'packages/authorization/proofs/**/*.lean'
      - 'packages/authorization/proofs/lean-toolchain'
      - 'packages/authorization/proofs/lakefile.toml'
      - 'packages/authorization/proofs/lake-manifest.json'
      - 'scripts/check-authorization-axioms.sh'
      - 'scripts/check-authorization-axioms.mjs'

  check-authorization-policy:
    toolchains: 'system'
    script: |
      scripts/check-authorization-generated.sh
      node scripts/check-authorization-policy-mutations.mjs
    inputs:
      - 'docs/auth/authorization-spec/**'
      - 'scripts/authorization-policy.mjs'
      - 'scripts/generate-authorization-policy.mjs'
      - 'scripts/check-authorization-generated.sh'
      - 'scripts/check-authorization-policy-mutations.mjs'
      - 'packages/authorization/src/generated/**'
      - 'packages/authorization/proofs/Authorization/GeneratedPolicy.lean'

  check-authorization-lean-mutations:
    toolchains: 'system'
    script: 'node scripts/check-authorization-lean-mutations.mjs'
    inputs:
      - 'packages/authorization/proofs/**/*.lean'
      - 'packages/authorization/proofs/lean-toolchain'
      - 'packages/authorization/proofs/lakefile.toml'
      - 'packages/authorization/proofs/lake-manifest.json'
      - 'scripts/check-authorization-lean-mutations.mjs'

  check-authorization-traceability:
    toolchains: 'system'
    script: 'node scripts/check-authorization-traceability.mjs'
    deps:
      - 'authorization:test'
      - 'authorization:conformance'
      - '~:check-authorization-policy'
    inputs:
      - 'docs/auth/authorization-spec/**'
      - 'packages/authorization/scripts/run-authorization-conformance.mjs'
      - 'packages/authorization/**/*.lean'
      - 'packages/authorization/test/**'
      - 'scripts/check-authorization-traceability.mjs'

  check-authorization-mutations:
    toolchains: 'system'
    script: |
      pnpm --filter @webrtc/authorization mutation
      node scripts/check-authorization-stryker-report.mjs
    inputs:
      - 'packages/authorization/src/**'
      - 'packages/authorization/test/**'
      - 'packages/authorization/stryker.config.mjs'
      - 'packages/authorization/mutation-exclusions.json'
      - 'scripts/check-authorization-stryker-report.mjs'

  check-authorization-proofs:
    toolchains: 'system'
    script: >-
      elan run --install "$(cat packages/authorization/proofs/lean-toolchain)"
      lake -d packages/authorization/proofs build AuthorizationProofs
    inputs:
      - 'packages/authorization/proofs/**/*.lean'
      - 'packages/authorization/proofs/lean-toolchain'
      - 'packages/authorization/proofs/lakefile.toml'
      - 'packages/authorization/proofs/lake-manifest.json'

  setup-tlc:
    toolchains: 'system'
    command: 'scripts/setup-tlc.sh'

  check-models:
    toolchains: 'system'
    command: 'scripts/check-models.sh'
    deps:
      - '~:setup-tlc'
    inputs:
      - 'packages/**/*.tla'
      - 'packages/**/*.cfg'
