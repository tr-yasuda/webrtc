language: 'rust'

taskOptions:
  cache: false

tasks:
  build:
    command: 'cargo build --workspace --locked'
  format:
    command: 'cargo fmt --all --check'
  typecheck:
    command: 'cargo check --workspace --all-targets --locked'
  lint:
    command: 'cargo clippy --workspace --all-targets --locked'
    env:
      CARGO_BUILD_WARNINGS: 'deny'
  test:
    command: 'cargo test --workspace --locked'

  verify-lean:
    toolchains: 'system'
    script: |
      set -eu
      cd crates/stun/verification/lean
      toolchain=$(cat lean-toolchain)
      elan run --install "$toolchain" lake build
    inputs:
      - 'crates/stun/verification/lean/**/*.lean'
      - 'crates/stun/verification/lean/lean-toolchain'
      - 'crates/stun/verification/lean/lakefile.toml'
      - 'crates/stun/verification/lean/lake-manifest.json'

  setup-tlc:
    toolchains: 'system'
    script: |
      set -eu
      cd packages/browser-sdk/verification/tla
      jar=.cache/tla2tools.jar
      expected=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      if [ -f "$jar" ]; then
        checksum=$(openssl dgst -sha256 -r "$jar")
        if [ "${checksum%% *}" = "$expected" ]; then
          exit 0
        fi
      fi

      mkdir -p .cache
      download=$(mktemp .cache/tla2tools.XXXXXXXX)
      trap 'rm -f -- "$download"' EXIT
      curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$download"
      checksum=$(openssl dgst -sha256 -r "$download")
      if [ "${checksum%% *}" != "$expected" ]; then
        echo "tla2tools.jar: SHA-256 mismatch" >&2
        exit 1
      fi
      mv "$download" "$jar"

  verify-tla:
    toolchains: 'system'
    deps:
      - '~:setup-tlc'
    script: |
      set -eu
      cd packages/browser-sdk/verification/tla
      tmp=$(mktemp -d)
      trap 'rm -rf -- "$tmp"' EXIT
      java -Djava.io.tmpdir="$tmp" -jar .cache/tla2tools.jar -workers 1 -metadir "$tmp" ConnectionNotifications.tla
    inputs:
      - 'packages/browser-sdk/verification/tla/**/*.tla'
      - 'packages/browser-sdk/verification/tla/**/*.cfg'
