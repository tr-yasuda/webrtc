dependsOn:
  - 'domain'

tasks:
  typecheck:
    deps:
      - 'domain:build'
  build:
    deps:
      - 'domain:build'
  conformance:
    command: 'pnpm run test:conformance'
  mutation:
    command: 'pnpm run mutation'
    options:
      cache: false
  traceability:
    command: 'pnpm run check:traceability'
