language: 'unknown'

tasks:
  setup:
    script: |
      set -eu
      jar=.cache/tla2tools.jar
      expected=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      if [ -f "$jar" ]; then
        checksum=$(openssl dgst -sha256 -r "$jar")
        if [ "${checksum%% *}" = "$expected" ]; then
          exit 0
        fi
      fi

      mkdir -p .cache
      download=$(mktemp .cache/tla2tools.XXXXXXXX)
      trap 'rm -f -- "$download"' EXIT
      curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$download"
      checksum=$(openssl dgst -sha256 -r "$download")
      if [ "${checksum%% *}" != "$expected" ]; then
        echo "tla2tools.jar: SHA-256 mismatch" >&2
        exit 1
      fi
      mv "$download" "$jar"
    options:
      cache: false

  verify:
    deps:
      - '~:setup'
    script: |
      set -eu
      tmp=$(mktemp -d)
      trap 'rm -rf -- "$tmp"' EXIT
      java -Djava.io.tmpdir="$tmp" -jar .cache/tla2tools.jar -workers 1 -metadir "$tmp" ConnectionNotifications.tla
    inputs:
      - '**/*.tla'
      - '**/*.cfg'
    options:
      cache: false
