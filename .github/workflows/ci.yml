name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up zizmor
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.9.12
          install_args: 'aqua:zizmorcore/zizmor'
          cache: false

      - name: Check GitHub Actions
        run: zizmor --offline --strict-collection --no-config --no-ignores .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: '1.100.0'
          components: clippy,rustfmt
          build-warnings: ''
          cache: false

      - name: Set up Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          moon-version: '2.6.5'
          cache: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'

      - name: Set up TLC
        run: moon run :setup-tlc

      - name: Set up Lean
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: crates/stun/proofs
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace formatting
        run: pnpm run format:check

      - name: Lint TypeScript and JavaScript
        run: pnpm run lint

      - name: Type-check, build, and test TypeScript
        run: pnpm test

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

      - name: Check Rust formatting
        run: moon run rust:format

      - name: Type-check Rust
        run: moon run rust:typecheck

      - name: Lint Rust
        run: moon run rust:lint

      - name: Build Rust
        run: moon run rust:build

      - name: Test Rust
        run: moon run rust:test

      - name: Check STUN proofs with Lean
        run: moon run :check-proofs

      - name: Model-check Browser SDK notifications
        run: moon run :check-models
