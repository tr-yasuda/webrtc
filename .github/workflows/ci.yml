name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Build, and Test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        env:
          RUSTUP_VERSION: '1.29.3'
        with:
          toolchain: '1.100.0'
          components: clippy, rustfmt
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          moon-version: '2.6.5'
          proto-version: '0.64.0'
          cache: false
      - name: Install zizmor
        run: |
          pipx install 'zizmor==1.32.0'
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit GitHub Actions
        run: pnpm run check:actions
      - name: Check formatting (TypeScript)
        run: pnpm run format:check
      - name: Check formatting (Rust)
        run: moon run :format
      - name: Lint TypeScript
        run: pnpm run lint
      - name: Lint Rust
        run: moon run :lint
      - name: Typecheck
        run: moon run :typecheck
      - name: Build
        run: moon run :build --upstream none
      - name: Test
        run: moon run :test --upstream none
