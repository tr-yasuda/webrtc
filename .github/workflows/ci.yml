name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Build, and Test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.9.12
          cache: true
      - name: Cache Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/stun/verification/lean/lean-toolchain') }}
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: crates/stun/verification/lean
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workspace formatting
        run: pnpm run format:check
      - name: Lint TypeScript and JavaScript
        run: pnpm run lint
      - name: Type-check, build, and test TypeScript
        run: pnpm test
      - name: Check Rust formatting
        run: moon run rust:format
      - name: Type-check Rust
        run: moon run rust:typecheck
      - name: Lint Rust
        run: moon run rust:lint
      - name: Build Rust
        run: moon run rust:build
      - name: Test Rust
        run: moon run rust:test
      - name: Check STUN proofs with Lean
        run: moon run stun-lean:verify
      - name: Model-check Browser SDK notifications
        run: moon run browser-sdk-tla:verify
