[tools]
node = "24.21.0"
pnpm = "10.34.9"
rust = { version = "1.100.0", profile = "minimal", components = "clippy,rustfmt" }
"aqua:moonrepo/moon" = "2.6.5"
zizmor = "1.32.0"

[tasks."check:actions"]
description = "Require full commit SHAs for external GitHub Actions references"
run = "node scripts/check-action-pins.mjs"

[tasks.setup]
description = "Install pinned workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.verify]
description = "Build and verify the TypeScript and Rust workspaces"
depends = ["check:actions"]
run = "moon run :build :typecheck :lint :test"
